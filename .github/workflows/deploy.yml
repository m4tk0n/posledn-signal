name: Deploy POSLEDNÍ SIGNÁL to Webzdarma

on:
  push:
    branches: [main]

# Prevent overlapping FTP deployments from racing each other.
concurrency:
  group: posledni-signal-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: PHP syntax checks
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Database schema checks
        run: php tests/schema_test.php

      - name: Game rules checks
        run: php tests/game_rules_test.php

      - name: Environment configuration checks
        run: php tests/env_test.php

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /posledn-signal/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            .env
            README.md
            tests/**
            tests/
