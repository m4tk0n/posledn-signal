name: Deploy POSLEDNÍ SIGNÁL to Webzdarma

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-posledni-signal
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy to Webzdarma via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /posledn-signal/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.local
            **/.env.production
            **/.env.*.local
            **/node_modules/**
            **/vendor/**
            **/__pycache__/**
            **/*.pyc
            **/*.log
